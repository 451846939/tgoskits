CONFIG_MAIN_STACK_SIZE=8192
CONFIG_NET_RX_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=4096
CONFIG_STACK_SENTINEL=y
CONFIG_THREAD_STACK_INFO=y
# AxVisor enters a bare-metal guest at EL1h without preloading SP_EL1.
# Zephyr establishes its runtime stacks during early architecture startup, but
# CONFIG_INIT_STACKS touches the incoming stack before that setup completes.
# Keep stack metadata and sentinels enabled while avoiding the pre-init fill.
CONFIG_INIT_STACKS=n
CONFIG_FRAME_POINTER=y
CONFIG_EXCEPTION_STACK_TRACE=y
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="10.0.2.15"
CONFIG_NET_CONFIG_PEER_IPV4_ADDR="10.0.2.10"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="10.0.2.1"
CONFIG_NET_L2_ETHERNET=y
CONFIG_ETH_DRIVER=y
CONFIG_PCIE=y
CONFIG_PCIE_CONTROLLER=y
CONFIG_PCIE_ECAM=y
CONFIG_ETH_E1000=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_NET_STATISTICS=y
CONFIG_ETHERNET_LOG_LEVEL_INF=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK=y
