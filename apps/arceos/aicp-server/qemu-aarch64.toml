args = [
  "-machine", "virt",
  "-cpu", "cortex-a72",
  "-m", "512M",
  "-smp", "1",
  "-nographic",
  "-device", "virtio-blk-pci,drive=disk0",
  "-drive", "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/runtime-assets/apps/arceos/aicp-server/disk.img",
  "-device", "virtio-net-pci,netdev=net0",
  "-netdev", "user,id=net0,hostfwd=tcp::18800-:8800",
  "-serial", "mon:stdio",
]
uefi = false
to_bin = true
success_regex = ["AICP ArceOS RTOS server listening on 0.0.0.0:8800"]
fail_regex = ["(?i)\\bpanic(?:ked)?\\b"]
timeout = 60
