env = { AX_IP = "10.0.3.15", AX_GW = "10.0.3.2", AX_PREFIX_LEN = "24" }

# AxRuntime consumes AX_IP before network initialization, so eth0 is static
# and DHCP cannot replace the guest-to-guest address afterwards.
features = []
log = "Info"
max_cpu_num = 1
target = "aarch64-unknown-none-softfloat"
to_bin = true
