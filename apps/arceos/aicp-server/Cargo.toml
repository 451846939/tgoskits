[package]
name = "arceos-aicp-server"
version = "0.1.0"
edition.workspace = true
authors = ["TGOSKits AI RTOS Demo"]
license.workspace = true
publish = false

[features]
default = []
arceos = ["dep:ax-std", "ax-std/net", "ax-std/multitask"]

[dependencies]
aicp-rust-protocol = { workspace = true }
ax-std = { workspace = true, optional = true }

[package.metadata.axstd]
features = ["log-level-info", "net", "multitask"]
