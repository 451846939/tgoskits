args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "virtio-blk-device,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "console=ttyAMA0",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "(?m)^vpci smoke failed\\s*$",
    "(?m)^vpci bar2 smoke failed:",
]
success_regex = [
    "(?s)VM A writes BAR2.*VM A writes doorbell\\(target=B\\).*VM B observes doorbell event.*VM B reads same data.*VM B writes BAR2.*VM B writes doorbell\\(target=A\\).*VM A reads same data.*VM A observes doorbell event.*vpci bar2 shared memory pass",
]
to_bin = true
uefi = false
