# Vm base info configs
#
[base]
# Guest vm id.
id = 2
# Guest vm name.
name = "linux-vpci-peer1"
# Virtualization type.
vm_type = 1
# The number of virtual CPUs.
cpu_num = 1
# Guest vm physical cpu ids.
phys_cpu_ids = [1]

#
# Vm kernel configs
#
[kernel]
# The entry point of the kernel image.
entry_point = 0x8020_0000
# The location of image: "memory" | "fs".
image_location = "fs"
# The file path of the kernel image.
kernel_path = "/guest/linux/linux-qemu"
# The load address of the kernel image.
kernel_load_addr = 0x8020_0000
# The load address of the device tree blob (DTB).
dtb_load_addr = 0x8000_0000
# The file path of the initramfs image.
ramdisk_path = "/guest/linux/vpci-bar2-initramfs.cpio"
# The load address of the initramfs image.
ramdisk_load_addr = 0x8800_0000

# Memory regions with format (`base_paddr`, `size`, `flags`, `map_type`).
# For `map_type`, 0 means `MAP_ALLOC`, 1 means `MAP_IDENTICAL`, 2 means `MAP_RESERVED`.
memory_regions = [
    [0x8000_0000, 0x1000_0000, 0x7, 0], # System RAM 256M MAP_ALLOC
]

#
# Device specifications
#
[devices]
# The interrupt mode.
interrupt_mode = "passthrough"

# Pass-through devices.
passthrough_devices = [
    ["/"],
]

# Passthrough addresses.
# Base-GPA  Length.
passthrough_addresses = []

# Devices that are not desired to be passed through to the guest.
excluded_devices = [
    ["/pcie@10000000"],
    ["/virtio_mmio@a000000"],
    ["/virtio_mmio@a000200"],
    ["/virtio_mmio@a000400"],
    ["/virtio_mmio@a000600"],
    ["/virtio_mmio@a000800"],
    ["/virtio_mmio@a000a00"],
    ["/virtio_mmio@a000c00"],
    ["/virtio_mmio@a000e00"],
    ["/virtio_mmio@a001000"],
    ["/virtio_mmio@a001200"],
    ["/virtio_mmio@a001400"],
    ["/virtio_mmio@a001600"],
    ["/virtio_mmio@a001800"],
    ["/virtio_mmio@a001a00"],
    ["/virtio_mmio@a001c00"],
    ["/virtio_mmio@a001e00"],
    ["/virtio_mmio@a002000"],
    ["/virtio_mmio@a002200"],
    ["/virtio_mmio@a002400"],
    ["/virtio_mmio@a002600"],
    ["/virtio_mmio@a002800"],
    ["/virtio_mmio@a002a00"],
    ["/virtio_mmio@a002c00"],
    ["/virtio_mmio@a002e00"],
    ["/virtio_mmio@a003000"],
    ["/virtio_mmio@a003200"],
    ["/virtio_mmio@a003400"],
    ["/virtio_mmio@a003600"],
    ["/virtio_mmio@a003800"],
    ["/virtio_mmio@a003a00"],
    ["/virtio_mmio@a003c00"],
    ["/virtio_mmio@a003e00"],
]

# Emu_devices.
# Name Base-Ipa Ipa_len Alloc-Irq Emu-Type EmuConfig.
# For ivshmem-pci, EmuConfig is:
# [bus, device, function, vendor_id, device_id, pci_mem_base, pci_mem_size,
#  bar0_base, bar0_size, link_id, peer_id, peers, feature_flags,
#  bar2_base, bar2_size, bar2_host_backing].
emu_devices = [
    ["ivshmem-pci", 0x5000_0000, 0x10_0000, 60, 0x81, [0, 5, 0, 0xaaaa, 0x0002, 0x5010_0000, 0x30_0000, 0x5010_0000, 0x1000, 1, 1, 2, 0, 0x5020_0000, 0x20_0000, 0]],
]
