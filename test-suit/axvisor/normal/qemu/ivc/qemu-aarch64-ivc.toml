args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "virtio-blk-device,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "root=/dev/vda rw init=/bin/sh",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "ivc publish failed",
    "ivc perf test failed",
    "IVC perf checksum mismatch",
    "(?m)^linux ivc demo failed\\s*$",
]
# Concurrent console streams may prepend ANSI SGR resets to a completion line.
success_regex = [
    "(?m)^(?:\\x1b\\[[0-9;]*m)*ivc perf test pass\\s*$",
]
shell_prefix = "~ #"
shell_init_cmd = '''
echo "linux ivc kernel $(uname -r)"
chmod +x /root/ivc-subscribe || true
if ! insmod /root/axvisor.ko; then
    echo 'linux ivc demo failed'
elif ! test -e /dev/axivc; then
    echo 'linux ivc demo failed'
elif ! sleep 1; then
    echo 'linux ivc demo failed'
elif ! /root/ivc-subscribe 1 0x49564301 perf; then
    echo 'linux ivc demo failed'
else
    echo 'linux ivc perf subscriber finished'
fi
'''
to_bin = true
uefi = false
