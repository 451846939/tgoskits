args = [
    "-nographic",
    "-cpu",
    "cortex-a72",
    "-machine",
    "virt,virtualization=on,gic-version=3",
    "-smp",
    "4",
    "-device",
    "virtio-blk-device,drive=disk0",
    "-drive",
    "id=disk0,if=none,format=raw,file=${workspace}/tmp/axbuild/rootfs/rootfs-aarch64-alpine.img",
    "-append",
    "console=ttyAMA0",
    "-m",
    "8g",
]
fail_regex = [
    "(?i)\\bpanic(?:ked)?\\b",
    "(?i)kernel panic",
    "(?i)unhandled page fault",
    "(?i)page fault",
    "(?m)^ivshmem bar2 smoke failed:",
]
success_regex = [
    "(?s)ivshmem-pci vendor=0x1af4 device=0x1110.*ivshmem irq=[1-9][0-9]*.*ivshmem uio device=/dev/uio[0-9]+.*ivshmem uio event count=[0-9]+.*ivshmem uio event count=[0-9]+.*ivshmem bar2 shared memory pass",
]
to_bin = true
uefi = false
