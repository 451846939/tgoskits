[base]
id = 1
name = "linux-rt-poll-idle"
guest_type = "passthrough"
cpu_num = 2
# Keep pCPU0 for AxVisor's management, device, and interrupt work. The two
# polling Linux vCPUs are isolated on the remaining physical CPUs.
phys_cpu_ids = [1, 2]

[kernel]
entry_point = 0x8020_0000
image_location = "memory"
kernel_path = "${workspace}/tmp/axbuild/images/qemu-aarch64/linux/linux-qemu"
kernel_load_addr = 0x8020_0000
dtb_load_addr = 0x8000_0000
ramdisk_path = "${workspace}/tmp/axbuild/axvisor/qemu-rt-poll-idle/initramfs-aarch64.cpio.gz"
ramdisk_load_addr = 0x8400_0000
memory_regions = [
  [0x8000_0000, 0x4000_0000, 0x7, 0],
]

[devices]
passthrough = []
disabled = []
